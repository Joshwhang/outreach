[project]
name = "outreach"
version = "0.1.0"
description = "Finance networking outreach: find contacts, guess emails, draft personalized cold emails, push to Gmail"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2",
  "openpyxl>=3.1",
  "pypdf>=4",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "google-api-python-client>=2",
  "google-auth-oauthlib>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
outreach = "outreach.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["outreach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
